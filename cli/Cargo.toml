[package]
name = "bookshelf-kobo-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bookshelf sync CLI for Kobo eReaders"

[[bin]]
name = "bookshelf-kobo"
path = "src/main.rs"

[dependencies]
argh = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serini = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "gzip"]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
